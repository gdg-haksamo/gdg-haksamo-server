# CD 워크플로: dev 브랜치 push 시 EC2에 자동 배포
#
# 동작 순서:
# 1. [build-and-push] Spring Boot JAR을 Docker 이미지로 빌드 → GHCR에 push
# 2. [deploy] EC2에 SSH 접속 → docker-compose.yml 전송 → .env 생성 → 컨테이너 재시작
#
# 필요한 GitHub Secrets (Settings → Secrets and variables → Actions):
#   EC2_HOST           - EC2 퍼블릭 IP (예: 3.35.xxx.xxx)
#   EC2_USERNAME       - ubuntu
#   EC2_SSH_KEY        - haksamo-key.pem 파일 내용 전체
#   DB_ROOT_PASSWORD   - MySQL root 비밀번호
#   DB_NAME            - 데이터베이스 이름 (예: haksamo)
#   DB_USERNAME        - DB 접속 계정
#   DB_PASSWORD        - DB 비밀번호
#   JWT_SECRET         - JWT 서명 키 (32바이트 이상 랜덤 문자열)

name: CD - Deploy to EC2

on:
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Docker 이미지 빌드 & GHCR에 push
  # ─────────────────────────────────────────────
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # GHCR 이미지 push 권한 (이 job에만 필요)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./haksamo       # Dockerfile이 있는 경로
          file: ./haksamo/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}:latest
          platforms: linux/arm64   # EC2 t4g.small은 ARM64 아키텍처
          # GitHub Actions 캐시로 빌드 속도 향상 (두 번째 실행부터 빠름)
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────
  # Job 2: EC2에 배포
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push  # Job 1이 성공해야 실행
    permissions:
      contents: read
      packages: read  # GHCR 이미지 pull 권한

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # docker-compose.yml을 EC2로 전송 (~/haksamo/ 디렉터리)
      - name: Copy docker-compose.yml to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: docker-compose.yml
          target: ~/haksamo/

      # SSH로 EC2 접속 → .env 생성 → 이미지 pull → 재시작
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          # github.actor/repository를 env 변수로 분리 (쉘 command injection 방지)
          GHCR_ACTOR: ${{ github.actor }}
          GHCR_REPOSITORY: ${{ github.repository }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: GHCR_ACTOR,GHCR_REPOSITORY
          script: |
            set -e
            cd ~/haksamo

            # .env 파일 생성 (EC2에 직접 비밀값을 기록, 파일은 EC2 로컬에만 존재)
            cat > .env << 'ENVEOF'
            DB_ROOT_PASSWORD=${{ secrets.DB_ROOT_PASSWORD }}
            DB_NAME=${{ secrets.DB_NAME }}
            DB_USERNAME=${{ secrets.DB_USERNAME }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            ENVEOF

            # GHCR 로그인 (이미지 pull 권한)
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
              -u "$GHCR_ACTOR" --password-stdin

            # 최신 이미지 다운로드
            docker pull "ghcr.io/$GHCR_REPOSITORY:latest"

            # 기존 컨테이너 중지 후 새 이미지로 재시작
            # --profile prod: app 서비스 포함 (로컬에서는 db만 뜨도록 분리)
            docker compose --profile prod down
            docker compose --profile prod up -d

            # 사용하지 않는 오래된 이미지 정리 (디스크 절약)
            docker image prune -f

            echo "✅ 배포 완료!"
