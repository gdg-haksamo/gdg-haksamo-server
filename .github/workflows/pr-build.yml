name: PR Build Check

# dev 브랜치로의 PR(생성/업데이트/재오픈) 시 ./gradlew build 자동 실행
# 빌드 실패하면 PR 머지 전에 빨리 알아챌 수 있도록

on:
  pull_request:
    branches:
      - dev
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  Build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: haksamo
          MYSQL_USER: haksamo
          MYSQL_PASSWORD: haksamo
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Grant execute permission for Gradle
        run: chmod +x ./haksamo/gradlew

      - name: Build with Gradle (clean build)
        working-directory: ./haksamo
        env:
          SPRING_PROFILES_ACTIVE: dev
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: haksamo
          DB_USERNAME: haksamo
          DB_PASSWORD: haksamo
          JWT_SECRET: test-secret-for-ci-environment-minimum-32chars
        run: ./gradlew clean build --no-daemon