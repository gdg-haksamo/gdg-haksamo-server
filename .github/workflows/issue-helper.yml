# 이슈 봇: 라벨 없이 이슈 생성되면 안내 댓글 → 라벨 붙으면 안내 댓글 삭제 + 환영 댓글
name: Issue Helper

on:
  issues:
    types: [opened, labeled]

permissions:
  issues: write

jobs:
  on-opened:
    if: github.event.action == 'opened'
    runs-on: ubuntu-latest
    steps:
      - name: Comment on issue without label
        if: toJSON(github.event.issue.labels) == '[]'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `⚠️ 이 이슈에는 아직 **라벨이 없습니다.**\n이슈 유형에 맞는 라벨을 붙여 주세요: \`feat\` / \`fix\` / \`docs\` / \`refactor\` / \`chore\`\n<!-- reminder-no-label -->`
            });
            await github.rest.issues.createReaction({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              content: 'eyes'
            });

      - name: Welcome comment (had labels from start)
        if: toJSON(github.event.issue.labels) != '[]'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `안녕하세요 @${{ github.event.issue.user.login }}님, 이슈를 등록해 주셔서 감사합니다. 🙌\n\n- **커밋·PR**: [커밋 컨벤션](https://github.com/gdg-haksamo/gdg-haksamo-server/blob/dev/.github/commit_convention.md)을 참고해 주세요.\n\n감사합니다.`
            });
            await github.rest.issues.createReaction({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              content: '+1'
            });

  on-labeled:
    if: github.event.action == 'labeled'
    runs-on: ubuntu-latest
    steps:
      - name: Find and delete reminder comment, then welcome
        uses: actions/github-script@v7
        with:
          script: |
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const reminder = comments.data.find(c => c.body.includes('reminder-no-label'));
            if (!reminder) return;

            await github.rest.issues.deleteComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: reminder.id,
            });

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `안녕하세요 @${{ github.event.issue.user.login }}님, 이슈를 등록해 주셔서 감사합니다. 🙌\n\n- **커밋·PR**: [커밋 컨벤션](https://github.com/gdg-haksamo/gdg-haksamo-server/blob/dev/.github/commit_convention.md)을 참고해 주세요.\n\n감사합니다.`
            });
            await github.rest.issues.createReaction({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              content: '+1'
            });
