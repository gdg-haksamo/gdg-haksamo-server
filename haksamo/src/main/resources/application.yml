spring:
  application:
    name: haksamo
  profiles:
    # 기본값 prod(페일시큐어): 프로파일 미지정 시 dev로 떨어져 DummyAuthFilter(인증 우회)가 켜지는 사고 방지.
    # 로컬은 .env(.env.example)가 SPRING_PROFILES_ACTIVE=dev를 명시하므로 영향 없음.
    active: ${SPRING_PROFILES_ACTIVE:prod}
  jackson:
    time-zone: Asia/Seoul
  config:
    import: optional:file:.env[.properties]

server:
  port: ${SERVER_PORT:8080}

jwt:
  secret: ${JWT_SECRET}
  access-expiration: ${JWT_ACCESS_EXPIRATION:3600000}          # 1시간
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:1209600000}     # 14일

# AI 추천(Gemini). dev는 스텁이 동작하므로 api-key 없이도 기동됨.
# prod는 RestGeminiClient가 실제 호출 → GEMINI_API_KEY 필수(Generative Language API 키, GCP 서비스계정 불필요).
gemini:
  api-key: ${GEMINI_API_KEY:}
  # gemini-1.5-flash는 v1beta에서 종료(404)되어 gemini-3.1-flash-lite로 교체(#79).
  # 신세대 lite — free tier 15 RPM / 1,500 RPD(최고)로 본 프로젝트 페이싱에 부합. ListModels로 stable 확인.
  model: ${GEMINI_MODEL:gemini-3.1-flash-lite}
  base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
  # 분당 호출 한도. 호출을 이 값 이하로 페이싱해 429를 원천 차단한다.
  # free tier 15 RPM보다 낮은 13을 기본값으로 둬 경계 오차에 안전 마진을 둔다. 유료 티어 시 상향.
  max-rpm: ${GEMINI_MAX_RPM:13}

# FCM 푸시 알림.
#  - enabled=false(기본): 발송을 로그로만 남김 → 자격증명 없이도 앱이 정상 기동(부팅 실패 방지).
#  - enabled=true: Firebase 서비스계정 JSON으로 실제 FCM 발송. credentials-json 필수.
# (prod 전용 @Profile 대신 자격증명 유무로 분기 → 자격증명 누락 시 크래시 루프 방지)
notification:
  push:
    firebase:
      enabled: ${FCM_ENABLED:false}
      credentials-json: ${FCM_CREDENTIALS_JSON:}

app:
  # Refresh Token 쿠키 속성 (프로파일/환경별 override)
  #  - dev(같은 사이트, http localhost): Lax / secure=false
  #  - prod(FE와 다른 도메인): None / secure=true  → CD .env에서 COOKIE_* 주입
  cookie:
    secure: ${COOKIE_SECURE:false}
    same-site: ${COOKIE_SAME_SITE:Lax}
  cors:
    # 쿠키 전송을 위해 와일드카드(*) 불가 — 명시적 origin 목록 (콤마 구분)
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:3000}
  # 부트스트랩 관리자 계정 (env로 주입, 없으면 시더 스킵). 평문은 env/Secrets에만, DB엔 BCrypt 해시 저장
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
    nickname: ${ADMIN_NICKNAME:관리자}
  # 이메일 인증번호 (회원가입 1단계)
  email-verification:
    code-ttl: ${EMAIL_CODE_TTL:180000}        # 인증번호 유효시간(ms). FE 타이머와 일치시킬 것 (현재 3분)
    verified-ttl: ${EMAIL_VERIFIED_TTL:1800000} # 인증 완료 후 회원가입까지 허용 시간(ms, 30분)
    max-attempts: ${EMAIL_MAX_ATTEMPTS:5}      # 인증번호 검증 시도 제한 횟수
