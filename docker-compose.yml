services:
  db:
    image: mysql:8.0
    container_name: haksamo-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - haksamo-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # EC2 배포용 앱 서비스
  # - GHCR에서 최신 이미지를 pull해서 실행
  # - DB_HOST=db → Docker 내부 네트워크에서 db 서비스 이름으로 접근
  # - profiles: [prod] → 로컬에서 docker compose up 할 때는 실행되지 않음
  #   EC2 CD 워크플로에서는 docker compose --profile prod up -d 로 실행
  app:
    profiles: [prod]
    image: ghcr.io/gdg-haksamo/gdg-haksamo-server:latest
    container_name: haksamo-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      # 이메일 인증번호 SMTP — 비우면 prod 부팅 실패(SmtpMailSender가 JavaMailSender 요구)
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      # 최초 SUPER_ADMIN 시더 — .env엔 있었지만 컨테이너로 전달되지 않아 시딩이 스킵되던 값
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NICKNAME: ${ADMIN_NICKNAME:-관리자}
      # AI 추천(Gemini) — 키 없으면 추천 503 (앱 기동에는 영향 없음)
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # FCM 푸시 — enabled=true + 서비스계정 JSON(base64)일 때만 실제 발송. 기본은 로그만(앱 정상 기동)
      FCM_ENABLED: ${FCM_ENABLED:-false}
      FCM_CREDENTIALS_JSON: ${FCM_CREDENTIALS_JSON:-}
    ports:
      - "8080:8080"

  # HTTPS 리버스 프록시 (Caddy) — EC2 배포용
  # - app:8080 으로 프록시. Let's Encrypt 인증서를 자동 발급·갱신한다(Caddyfile 없이 reverse-proxy 명령으로).
  # - CADDY_DOMAIN(.env)으로 발급 도메인 지정 → DuckDNS 서브도메인이 EC2 IP를 가리켜야 함.
  # - 80: HTTP-01 인증·HTTPS 리다이렉트 / 443: HTTPS  → EC2 보안그룹에서 둘 다 열어야 한다.
  # - caddy-data 볼륨에 인증서 영속 → 재배포(down/up) 시 재발급 안 함(Let's Encrypt 레이트리밋 회피).
  caddy:
    profiles: [prod]
    image: caddy:2-alpine
    container_name: haksamo-caddy
    restart: unless-stopped
    depends_on:
      - app
    command: caddy reverse-proxy --from ${CADDY_DOMAIN} --to app:8080
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config

volumes:
  haksamo-mysql-data:
  caddy-data:
  caddy-config:
