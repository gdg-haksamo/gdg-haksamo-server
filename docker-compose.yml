services:
  db:
    image: mysql:8.0
    container_name: haksamo-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - haksamo-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # EC2 배포용 앱 서비스
  # - GHCR에서 최신 이미지를 pull해서 실행
  # - DB_HOST=db → Docker 내부 네트워크에서 db 서비스 이름으로 접근
  # - profiles: [prod] → 로컬에서 docker compose up 할 때는 실행되지 않음
  #   EC2 CD 워크플로에서는 docker compose --profile prod up -d 로 실행
  app:
    profiles: [prod]
    image: ghcr.io/gdg-haksamo/gdg-haksamo-server:latest
    container_name: haksamo-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      # 이메일 인증번호 SMTP — 비우면 prod 부팅 실패(SmtpMailSender가 JavaMailSender 요구)
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      # 최초 SUPER_ADMIN 시더 — .env엔 있었지만 컨테이너로 전달되지 않아 시딩이 스킵되던 값
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NICKNAME: ${ADMIN_NICKNAME:-관리자}
    ports:
      - "8080:8080"

volumes:
  haksamo-mysql-data:
