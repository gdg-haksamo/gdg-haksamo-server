# CodeRabbit 설정 파일
# 설치: https://github.com/marketplace/coderabbitai

language: ko-KR

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  changed_files_summary: true
  sequence_diagrams: true
  poem: false
  review_status: false
  collapse_walkthrough: false

  auto_review:
    enabled: true
    auto_incremental_review: true
    drafts: false

  instructions: |
    학사모 프로젝트의 코딩 컨벤션을 준수하는지 확인해주세요.

    **필수 규칙:**
    - DTO는 class 타입을 사용합니다 (record 미사용 — 팀 합의)
    - Entity에는 @Setter를 두지 않습니다 (불변성 보호)
    - 생성자 주입(@RequiredArgsConstructor) 사용 — 필드 주입 금지

    **경고:**
    - Request DTO에는 validation 어노테이션(@NotNull, @NotBlank, @Email 등) 사용을 권장합니다
    - 빈 catch 블록은 피하고 최소한 로깅을 추가합니다
    - URL/상수는 하드코딩하지 말고 application.yml이나 상수 클래스로 관리합니다
    - TODO/FIXME 주석은 이슈로 등록하거나 즉시 해결합니다

    **보안:**
    - 민감정보(password, JWT_SECRET, API key 등)를 하드코딩하지 마세요
    - SQL injection, XSS 등 보안 취약점을 체크해주세요
    - @AuthenticationPrincipal로 받은 사용자 ID는 검증 없이 신뢰 가능하나, 그 외 요청 파라미터로 들어오는 ID는 권한 검증이 필요합니다

path_filters:
  excluded:
    - "*.txt"
    - "**/build/**"
    - "**/target/**"
    - "**/node_modules/**"
    - "**/dist/**"
    - "**/*.min.js"
    - "**/generated/**"
    - "**/.gradle/**"
    - "**/bin/**"
    - "docs/**/*.webp"
    - "docs/**/*.png"

chat:
  auto_reply: true

tone_instructions: >
  항상 한국어로 응답하고, 리뷰 코멘트와 요약, 제안 코드 모두
  자연스럽고 공손한 한국어 문장으로 작성해 주세요.
